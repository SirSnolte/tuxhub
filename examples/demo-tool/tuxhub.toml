# Beispiel-Tool für tuxhub (Stufe 2).
# Im Hub unter Einstellungen → Entwicklermodus diesen Ordner verknüpfen.

id = "demo-tool"
name = "Demo-Tool"
description = "Zeigt, wie ein Tool mit eigener Oberfläche, Einstellungen und Hotkey funktioniert."
icon = "🧪"
version = "0.1.0"
ui = "ui/index.html"

[rpc]
command = "demo.py"

[[settings]]
key = "greeting"
label = "Begrüßung"
type = "text"
default = "Hallo"

[[actions]]
id = "count"
label = "Zählen"
primary = true
shortcut = "CTRL+ALT+F8"
