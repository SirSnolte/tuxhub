<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Demo Tool</title>
    <script src="/__tuxhub/bridge.js"></script>
    <style>
      :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
      body { margin: 0; padding: 20px; background: transparent; }
      .big { font-size: 48px; font-weight: 700; }
      button, input { font: inherit; padding: 6px 12px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h2>Interface provided by the tool</h2>
    <p>This page lives in <code>ui/index.html</code> and talks to <code>demo.py</code> through the bridge.</p>
    <div class="big" id="count">0</div>
    <p id="text"></p>
    <p>
      <button id="btn">Count</button>
      <input id="greeting" placeholder="Greeting" aria-label="Greeting" />
      <button id="save">Save</button>
    </p>
    <p id="echo"></p>
    <script src="app.js"></script>
  </body>
</html>
